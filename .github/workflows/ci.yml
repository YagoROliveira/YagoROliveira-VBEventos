name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://events:events@localhost:5432/events?schema=public
      API_KEY: dev-events-api-key
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: events
          POSTGRES_PASSWORD: events
          POSTGRES_DB: events
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U events -d events"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: npm run test:integration

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Subir API, web e Postgres
        working-directory: .
        run: docker compose up -d --build --wait postgres api web
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes E2E (Playwright)
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8081
          CI: true
      - name: Enviar relatório Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          if-no-files-found: ignore
          path: |
            web/playwright-report
            web/test-results
            RELATORIO-E2E.md
      - name: Derrubar stack
        if: always()
        working-directory: .
        run: docker compose down -v
