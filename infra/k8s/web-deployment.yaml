apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-web
  namespace: events
  labels:
    app: events-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: events-web
  template:
    metadata:
      labels:
        app: events-web
    spec:
      containers:
        - name: web
          image: events-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: API_UPSTREAM
              value: events-api:3000
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: events-api
                  key: API_KEY
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: events-web
  namespace: events
spec:
  selector:
    app: events-web
  ports:
    - name: http
      port: 80
      targetPort: http
